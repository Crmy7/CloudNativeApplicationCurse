name: CI Pipeline

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop, feature/docker, feature/auto-deploy-local-ci, main ]

jobs:

  lint:
    name: Lint frontend & backend
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  build:
    name: Build frontend & backend
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: backend
        run: |
          npm install
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "No backend build script"
          fi

  tests:
    name: Run backend tests
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Run tests
        working-directory: backend
        run: npm test

  docker-build:
    name: Build Docker Images
    runs-on: self-hosted
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend-ci ./backend

      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

  smoke-tests:
    name: Smoke Tests
    runs-on: self-hosted
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Stop any existing stack
        run: docker compose -f docker-compose.ci.yaml -p ci down -v --remove-orphans || true

      - name: Start CI stack
        run: docker compose -f docker-compose.ci.yaml -p ci up -d --build --wait
        timeout-minutes: 5

      - name: Wait for services to be ready
        run: sleep 15

      - name: Test /health endpoint
        run: curl -f http://localhost:3009/health

      - name: Test /whoami endpoint
        run: curl -f http://localhost:3009/whoami

      - name: Test frontend responds
        run: curl -f http://localhost:8089

      - name: Stop CI stack
        if: always()
        run: docker compose -f docker-compose.ci.yaml -p ci down -v --remove-orphans

  publish:
    name: Push Docker Images to GHCR
    runs-on: self-hosted
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u crmy7 --password-stdin

      - name: Build backend image
        run: docker build -t backend-ci ./backend

      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

      - name: Tag backend image (SHA)
        run: docker tag backend-ci ghcr.io/crmy7/cloudnative-backend:${{ github.sha }}

      - name: Tag frontend image (SHA)
        run: docker tag frontend-ci ghcr.io/crmy7/cloudnative-frontend:${{ github.sha }}

      - name: Tag latest (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag backend-ci ghcr.io/crmy7/cloudnative-backend:latest
          docker tag frontend-ci ghcr.io/crmy7/cloudnative-frontend:latest

      - name: Push backend
        run: docker push --all-tags ghcr.io/crmy7/cloudnative-backend

      - name: Push frontend
        run: docker push --all-tags ghcr.io/crmy7/cloudnative-frontend

  deploy:
    name: Deploy to Local Environment
    runs-on: self-hosted
    needs: publish
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/docker' || github.ref == 'refs/heads/feature/auto-deploy-local-ci'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u crmy7 --password-stdin

      - name: Run deploy script
        run: bash scripts/deploy.sh
        env:
          GITHUB_SHA: ${{ github.sha }}

  sonarcloud:
    name: SonarCloud Quality Analysis
    runs-on: self-hosted
    needs: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run SonarCloud Scanner
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.sources=src \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=false
